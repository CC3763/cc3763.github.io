<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#f7f6f3"/>

  <text x="40" y="42" font-size="19" font-weight="700" fill="#1f2937">健康管理系统 · 技术架构</text>
  <text x="40" y="64" font-size="12" fill="#9ca3af">Health Manager — System Architecture</text>

  <!-- 前端层 -->
  <rect x="40" y="90" width="820" height="108" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="56" y="114" font-size="13" font-weight="600" fill="#3b82f6">前端层</text>
  <text x="118" y="114" font-size="11" fill="#9ca3af">Vue 3 + Vite + Tailwind</text>

  <rect x="60" y="128" width="140" height="52" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="130" y="150" font-size="12" fill="#1e40af" text-anchor="middle">仪表盘</text>
  <text x="130" y="168" font-size="10" fill="#60a5fa" text-anchor="middle">Dashboard</text>

  <rect x="215" y="128" width="140" height="52" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="285" y="150" font-size="12" fill="#1e40af" text-anchor="middle">报告校核</text>
  <text x="285" y="168" font-size="10" fill="#60a5fa" text-anchor="middle">Report Detail</text>

  <rect x="370" y="128" width="140" height="52" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="440" y="150" font-size="12" fill="#1e40af" text-anchor="middle">指标趋势</text>
  <text x="440" y="168" font-size="10" fill="#60a5fa" text-anchor="middle">Metric Trend</text>

  <rect x="525" y="128" width="140" height="52" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="595" y="150" font-size="12" fill="#1e40af" text-anchor="middle">人体图</text>
  <text x="595" y="168" font-size="10" fill="#60a5fa" text-anchor="middle">Body Map</text>

  <rect x="680" y="128" width="160" height="52" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="760" y="150" font-size="12" fill="#1e40af" text-anchor="middle">用药 / 就诊</text>
  <text x="760" y="168" font-size="10" fill="#60a5fa" text-anchor="middle">Medication / Visit</text>

  <!-- 箭头 -->
  <line x1="450" y1="198" x2="450" y2="228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="218" font-size="10" fill="#6b7280">Axios + JWT</text>

  <!-- 后端层 -->
  <rect x="40" y="230" width="820" height="150" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="56" y="254" font-size="13" font-weight="600" fill="#10b981">后端层</text>
  <text x="118" y="254" font-size="11" fill="#9ca3af">FastAPI · 36 个 API 端点</text>

  <rect x="60" y="270" width="180" height="96" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="150" y="292" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">认证与隔离</text>
  <text x="150" y="312" font-size="10" fill="#34d399" text-anchor="middle">JWT · bcrypt</text>
  <text x="150" y="330" font-size="10" fill="#34d399" text-anchor="middle">user_id 数据隔离</text>
  <text x="150" y="348" font-size="10" fill="#34d399" text-anchor="middle">路由守卫</text>

  <rect x="255" y="270" width="180" height="96" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="345" y="292" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">报告服务</text>
  <text x="345" y="312" font-size="10" fill="#34d399" text-anchor="middle">上传 · 压缩 · 加密</text>
  <text x="345" y="330" font-size="10" fill="#34d399" text-anchor="middle">PDF 分页渲染</text>
  <text x="345" y="348" font-size="10" fill="#34d399" text-anchor="middle">BackgroundTasks</text>

  <rect x="450" y="270" width="180" height="96" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="540" y="292" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">识别与解析</text>
  <text x="540" y="312" font-size="10" fill="#34d399" text-anchor="middle">AI 视觉识别</text>
  <text x="540" y="330" font-size="10" fill="#34d399" text-anchor="middle">指标字典匹配</text>
  <text x="540" y="348" font-size="10" fill="#34d399" text-anchor="middle">异常判定</text>

  <rect x="645" y="270" width="195" height="96" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="742" y="292" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">数据层</text>
  <text x="742" y="312" font-size="10" fill="#34d399" text-anchor="middle">SQLAlchemy ORM</text>
  <text x="742" y="330" font-size="10" fill="#34d399" text-anchor="middle">SQLite · 12 表</text>
  <text x="742" y="348" font-size="10" fill="#34d399" text-anchor="middle">150 项指标字典</text>

  <!-- 箭头到外部层 -->
  <line x1="345" y1="380" x2="345" y2="410" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="540" y1="380" x2="540" y2="410" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- 外部服务层 -->
  <rect x="40" y="412" width="820" height="112" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="56" y="436" font-size="13" font-weight="600" fill="#f59e0b">外部服务</text>
  <text x="118" y="436" font-size="11" fill="#9ca3af">External Services</text>

  <rect x="60" y="452" width="230" height="56" rx="4" fill="#fffbeb" stroke="#fde68a"/>
  <text x="175" y="474" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">阿里云百炼</text>
  <text x="175" y="492" font-size="10" fill="#d97706" text-anchor="middle">qwen-vl-plus 视觉识别</text>

  <rect x="310" y="452" width="230" height="56" rx="4" fill="#fffbeb" stroke="#fde68a"/>
  <text x="425" y="474" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">本地文件系统</text>
  <text x="425" y="492" font-size="10" fill="#d97706" text-anchor="middle">AES-GCM 加密存储</text>

  <rect x="560" y="452" width="280" height="56" rx="4" fill="#fffbeb" stroke="#fde68a"/>
  <text x="700" y="474" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">systemd</text>
  <text x="700" y="492" font-size="10" fill="#d97706" text-anchor="middle">Restart=always 自动拉起</text>

  <!-- 技术栈总结 -->
  <text x="40" y="558" font-size="11" fill="#6b7280">技术栈：FastAPI 0.115 · Vue 3.4 · SQLite · SQLAlchemy 2.0 · PyMuPDF · cryptography · Vite 8 · Tailwind</text>
  <text x="40" y="580" font-size="11" fill="#6b7280">代码规模：后端 3,647 行 / 前端 2,882 行 · 36 个 API 端点 · 12 张数据表 · 150 项指标字典</text>
  <text x="40" y="602" font-size="11" fill="#9ca3af">数据全部存储在自有服务器，AI 识别仅上传单页图像，不入第三方数据库</text>
</svg>
